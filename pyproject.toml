[build-system]
requires = ["maturin == 1.15.0"]
build-backend = "maturin"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "rapidquery._core"

[project]
name = "rapidquery"
requires-python = ">=3.10"
keywords = [
    "SQL",
    "dynamic-sql",
    "sql-builder",
    "rapidorm",
    "pypika",
    "orm",
    "rapidquery",
]
authors = [{ name = "Ali Pooralijan", email = "awolverp@gmail.com" }]

classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Implementation :: CPython",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries",
]

dynamic = [
    "description",
    "license",
    "readme",
    "version"
]

[project.urls]
Homepage = "https://github.com/awolverp/rapidquery"
Repository = "https://github.com/awolverp/rapidquery"
Issues = "https://github.com/awolverp/rapidquery/issues"

[project.optional-dependencies]
orjson = [
    "orjson>=3.0.0",
]

[dependency-groups]
dev = [
    "maturin == 1.15.0",
    "pytest>=8.0.0",
]
