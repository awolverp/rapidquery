[package]
name = "rapidquery"
version = "0.1.0"
edition = "2021"
description = "RapidQuery is the fastest, full-feature, and easy-to-use Python SQL query builder written in Rust."
readme = "README.md"
license = "GNU GPLv3"
homepage = "https://github.com/awolverp/rapidquery"
repository = "https://github.com/awolverp/rapidquery.git"
authors = ["Ali Pooralijan <awolverp@gmail.com>"]

[lib]
name = "rapidquery"
crate-type = ["cdylib", "rlib"]

[profile.dev]
lto = true
panic = "unwind"
strip = true

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = true
panic = "unwind"
strip = true

[dependencies]
pyo3 = { version = "0.29", default-features = false, features = ["macros"] }
parking_lot = { version = "0.12", default-features = false }
sqlparser = { version = "0.62", default-features = false, features = ["recursive", "recursive-protection", "visitor"] }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[lints.clippy]
dbg_macro = "warn"
print_stdout = "warn"
