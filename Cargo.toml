[workspace]
members = ["rapidquery-macros"]

[package]
name = "rapidquery"
version = "1.0.0-alpha1"
edition = "2024"
description = "RapidQuery is the fastest, full-feature, and easy-to-use Python SQL query builder written in Rust."
readme = "README.md"
license = "MIT"
homepage = "https://github.com/awolverp/rapidquery"
repository = "https://github.com/awolverp/rapidquery.git"
authors = ["Ali Pooralijan <awolverp@gmail.com>"]

[lib]
name = "rapidquery"
crate-type = ["cdylib", "rlib"]

[profile.dev]
lto = true
panic = "unwind"
strip = false

[profile.release]
codegen-units = 1
debug = false
incremental = false
lto = true
panic = "abort"
strip = false
opt-level = 3

[dependencies]
rapidquery-macros = { path = "rapidquery-macros" }
pyo3 = { version = "0.29", default-features = false, features = [ "macros", "chrono", "py-clone" ] }
parking_lot = { version = "0.12", default-features = false }
hashbrown = { version = "0.17.1", default-features = false, features = ["allocator-api2", "default-hasher", "inline-more"] }
arcstr = { version = "1.2" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ipnetwork = { version = "0.20", default-features = false }
mac_address = { version = "1.1", default-features = false }
once_cell = { version = "1.21.4", default-features = false }
smallvec = { version = "1.16.0", default-features = false }

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

# Testing features
only-stdlib-json = []
only-orjson = []

[lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
